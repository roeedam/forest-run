<!doctype html>
<html lang="he">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Forest Run</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="gameWrap">
  <canvas id="gameCanvas" width="960" height="540"></canvas>

  <div id="touchZones" hidden></div>

  <div class="overlay" id="loadingScreen">
    <div class="subtext" id="loadingText">Loading...</div>
  </div>

  <div class="overlay" id="pauseScreen" hidden>
    <img src="assets/hud/pausetext.png" alt="Paused" style="width:min(220px,40vw)">
    <button class="bigBtn" id="resumeBtn">Resume</button>
  </div>

  <div class="overlay" id="gameOverScreen" hidden>
    <h1>Game Over</h1>
    <div class="subtext" id="finalScore" style="font-size:22px;color:#ffe066"></div>
    <div class="subtext" id="tarotNote" hidden>You found a Tarot Card this run!</div>
    <button class="bigBtn" id="retryBtn">Try Again</button>
  </div>

  <div id="hint" hidden>SWIPE UP = jump &nbsp; SWIPE DOWN = duck &nbsp; P = pause</div>
</div>

<script src="game.js"></script>
</body>
</html>
